<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact — AMB</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e54d4; --dark: #0c2461; --text: #04122e; --bg: #f8fafc;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); }

    .contact-container { display: flex; min-height: 100vh; }

    /* Panneau de gauche fixe */
    .info-panel { 
      flex: 0 0 40%; background: var(--dark); color: white; padding: 60px;
      display: flex; flex-direction: column; justify-content: space-between;
      position: sticky; top: 0; height: 100vh;
    }
    .logo { font-family: 'Syne'; font-size: 2rem; }
    .logo span { color: var(--primary); }
    .info-panel h1 { font-family: 'Syne'; font-size: 3.5rem; line-height: 1; margin: 40px 0; }
    
    /* Panneau de droite (Formulaire) */
    .form-panel { flex: 1; padding: 100px 10%; background: white; }
    .form-group { margin-bottom: 30px; }
    label { display: block; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    input, textarea { 
      width: 100%; padding: 20px; border: 1px solid #e2e8f0; border-radius: 12px;
      font-family: inherit; font-size: 1rem; transition: 0.3s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(30,84,212,0.1); }
    
    .btn-send { 
      background: var(--primary); color: white; padding: 20px 40px; border: none; 
      border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 1rem; width: 100%;
    }

    @media (max-width: 900px) {
      .contact-container { flex-direction: column; }
      .info-panel { height: auto; position: relative; flex: none; padding: 40px; }
    }
  </style>
</head>
<body>
  <div class="contact-container">
    <div class="info-panel">
      <div class="logo">AM<span>BAD</span></div>
      <div>
        <h1>Discutons de votre projet sportif.</h1>
        <p style="opacity: 0.7;">Gymnase Municipal, Rue d'Erevan, 53000 Laval</p>
      </div>
      <div class="socials">Instagram / Facebook / Badnet</div>
    </div>
    <div class="form-panel">
      <form>
        <div class="form-group"><label>Nom Complet</label><input type="text" placeholder="John Doe"></div>
        <div class="form-group"><label>Email</label><input type="email" placeholder="john@example.com"></div>
        <div class="form-group"><label>Votre Message</label><textarea rows="8" placeholder="Parlez-nous de votre niveau, vos envies..."></textarea></div>
        <button class="btn-send">ENVOYER LE MESSAGE</button>
      </form>
    </div>
  </div>
</body>
</html>
